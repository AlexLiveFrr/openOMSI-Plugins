name: Check plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.4 (the game's)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Every Lua file compiles
        run: |
          status=0
          while IFS= read -r -d '' f; do
            luac5.4 -p "$f" || { echo "::error file=$f::does not compile (Lua 5.4)"; status=1; }
          done < <(find plugins -name '*.lua' -print0)
          exit $status
      - name: Rules and catalog.json
        run: python3 tools/build_catalog.py --check
